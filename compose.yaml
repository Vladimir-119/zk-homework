services:
  zk1:
    image: zookeeper:3.9.6-jre-17
    hostname: zk1
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: "server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181"
    volumes:
      - ./state/zk1/data:/data
      - ./state/zk1/datalog:/datalog

  zk2:
    image: zookeeper:3.9.6-jre-17
    hostname: zk2
    ports:
      - "127.0.0.1:2182:2181"
    environment:
      ZOO_MY_ID: "2"
      ZOO_SERVERS: "server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181"
    volumes:
      - ./state/zk2/data:/data
      - ./state/zk2/datalog:/datalog

  zk3:
    image: zookeeper:3.9.6-jre-17
    hostname: zk3
    ports:
      - "127.0.0.1:2183:2181"
    environment:
      ZOO_MY_ID: "3"
      ZOO_SERVERS: "server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181"
    volumes:
      - ./state/zk3/data:/data
      - ./state/zk3/datalog:/datalog
